<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users Dashboard - E-Library</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  background: #f4f6fb;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #1e1e2f;
  color: #fff;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 30px;
  text-align: center;
}

.sidebar ul {
  list-style: none;
}

.sidebar ul li {
  margin: 20px 0;
}

.sidebar ul li a {
  color: #ccc;
  text-decoration: none;
  display: block;
  padding: 10px;
  border-radius: 6px;
}

.sidebar ul li a:hover,
.sidebar ul li a.active {
  background: #6c63ff;
  color: #fff;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

/* TABLE SECTION */
.table-section {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}

.table-section h3 {
  margin-bottom: 10px;
}

/* SEARCH */
.table-section input {
  padding: 8px;
  width: 250px;
  border-radius: 6px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

table th, table td {
  padding: 12px;
  text-align: left;
}

table th {
  background: #6c63ff;
  color: #fff;
}

table tr:nth-child(even) {
  background: #f4f6fb;
}

/* STATUS */
.status {
  padding: 5px 10px;
  background: green;
  color: white;
  border-radius: 5px;
  font-size: 12px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2><i class="fa-solid fa-book"></i> E-Library</h2>
  <ul>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="books_dashboard.html">Books</a></li>
    <li><a href="users_dashboard.html" class="active">Users</a></li>
    <li><a href="../login.html">Logout</a></li>
  </ul>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <h2><i class="fa-solid fa-users"></i> Users</h2>
  </div>

  <!-- USERS TABLE -->
  <div class="table-section">
    <h3>Registered Users</h3>

    <input type="text" placeholder="Search user...">

    <table>
      <tr>
        <th><i class="fa-solid fa-envelope"></i> Email</th>
        <th><i class="fa-solid fa-calendar"></i> Date Joined</th>
        <th><i class="fa-solid fa-user-check"></i> Status</th>
      </tr>

      <tr>
        <td>user1@gmail.com</td>
        <td>2024-01-12</td>
        <td><span class="status">Active</span></td>
      </tr>

      <tr>
        <td>mary@gmail.com</td>
        <td>2024-02-03</td>
        <td><span class="status">Active</span></td>
      </tr>

      <tr>
        <td>john@gmail.com</td>
        <td>2024-03-18</td>
        <td><span class="status">Active</span></td>
      </tr>

      <tr>
        <td>alex@gmail.com</td>
        <td>2024-04-09</td>
        <td><span class="status">Active</span></td>
      </tr>

      <tr>
        <td>sarah@gmail.com</td>
        <td>2024-05-21</td>
        <td><span class="status">Active</span></td>
      </tr>

    </table>

  </div>

</div>

</body>
</html>
