<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books Dashboard - E-Library</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  background: #f4f6fb;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #1e1e2f;
  color: #fff;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 30px;
  text-align: center;
}

.sidebar ul {
  list-style: none;
}

.sidebar ul li {
  margin: 20px 0;
}

.sidebar ul li a {
  color: #ccc;
  text-decoration: none;
  display: block;
  padding: 10px;
  border-radius: 6px;
}

.sidebar ul li a:hover,
.sidebar ul li a.active {
  background: #6c63ff;
  color: #fff;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

/* ADD BUTTON */
.add-btn {
  background: #6c63ff;
  color: #fff;
  padding: 10px 15px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
  transition: 0.3s;
}

.add-btn i {
  margin-right: 5px;
}

.add-btn:hover {
  background: #574fd6;
}

/* TABLE SECTION */
.table-section {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}

.table-section h3 {
  margin-bottom: 10px;
}

/* SEARCH */
.table-section input {
  padding: 8px;
  width: 250px;
  border-radius: 6px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

table th, table td {
  padding: 12px;
  text-align: left;
}

table th {
  background: #6c63ff;
  color: #fff;
}

table tr:nth-child(even) {
  background: #f4f6fb;
}

table tr:hover {
  background: #eaeaff;
}

/* STATUS */
.status {
  padding: 5px 10px;
  background: green;
  color: white;
  border-radius: 5px;
  font-size: 12px;
}

.status.borrowed {
  background: orange;
}

.status.unavailable {
  background: red;
}

/* ACTION BUTTONS */
.actions i {
  margin-right: 10px;
  cursor: pointer;
  font-size: 16px;
}

.actions .edit {
  color: #6c63ff;
}

.actions .delete {
  color: red;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .sidebar {
    display: none;
  }

  .main {
    width: 100%;
  }

  table {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2><i class="fa-solid fa-book"></i> E-Library</h2>
  <ul>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="books_dashboard.html" class="active">Books</a></li>
    <li><a href="users_dashboard.html">Users</a></li>
    <li><a href="../login.html">Logout</a></li>
  </ul>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <h2><i class="fa-solid fa-book-open"></i> Books</h2>
    <a href="add_book_dashboad.html" class="add-btn"><i class="fa-solid fa-plus"></i> Add Book</a>
  </div>

  <!-- TABLE SECTION -->
  <div class="table-section">
    <h3>Books Available</h3>

    <input type="text" placeholder="Search Book">

    <table>
      <tr>
        <th>Book</th>
        <th>Views</th>
        <th>Comments</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>

      <tr>
        <td>Python Programming</td>
        <td>2.9k</td>
        <td>210</td>
        <td><span class="status">Available</span></td>
        <td class="actions">
          <a href="edit_books_dashboard.html"><i class="fa-solid fa-pen-to-square edit"></i></a>
          <i class="fa-solid fa-trash delete"></i>
        </td>
      </tr>

      <tr>
        <td>Artificial Intelligence</td>
        <td>1.5k</td>
        <td>180</td>
        <td><span class="status borrowed">Borrowed</span></td>
        <td class="actions">
          <i class="fa-solid fa-pen-to-square edit"></i>
          <i class="fa-solid fa-trash delete"></i>
        </td>
      </tr>

      <tr>
        <td>Web Development</td>
        <td>1.2k</td>
        <td>150</td>
        <td><span class="status">Available</span></td>
        <td class="actions">
          <i class="fa-solid fa-pen-to-square edit"></i>
          <i class="fa-solid fa-trash delete"></i>
        </td>
      </tr>

      <tr>
        <td>IoT Basics</td>
        <td>2.1k</td>
        <td>190</td>
        <td><span class="status unavailable">Unavailable</span></td>
        <td class="actions">
          <i class="fa-solid fa-pen-to-square edit"></i>
          <i class="fa-solid fa-trash delete"></i>
        </td>
      </tr>

    </table>

  </div>

</div>

</body>
</html>
