<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - E-Library</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  background: #f4f6fb;
}

/* Sidebar */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #1e1e2f;
  color: #fff;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 30px;
  text-align: center;
}

.sidebar ul {
  list-style: none;
}

.sidebar ul li {
  margin: 20px 0;
}

.sidebar ul li a {
  color: #ccc;
  text-decoration: none;
  display: block;
  padding: 10px;
  border-radius: 6px;
}

.sidebar ul li a:hover,
.sidebar ul li a.active {
  background: #6c63ff;
  color: #fff;
}

/* Main Content */
.main {
  flex: 1;
  padding: 20px;
}

/* Topbar */
.topbar {
  margin-bottom: 20px;
}

/* Cards */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
}

/* Bigger Cards */
.card {
  background: #6c63ff;
  color: #fff;
  padding: 30px;
  border-radius: 12px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  opacity: 0.95;
}

/* Bigger Numbers */
.card h3 {
  font-size: 32px;
  margin-bottom: 10px;
}

/* Label */
.card p {
  font-size: 16px;
  opacity: 0.9;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2><i class="fa-solid fa-book"></i> E-Library</h2>
  <ul>
    <li><a href="dashboard.html" class="active">Dashboard</a></li>
    <li><a href="books_dashboard.html">Books</a></li>
    <li><a href="users_dashboard.html">Users</a></li> 
    <li><a href="../login.html">Logout</a></li>
  </ul>
</div>

<!-- Main Content -->
<div class="main">

  <!-- Topbar -->
  <div class="topbar">
    <h2>Dashboard - Stats</h2>
  </div>

  <!-- Cards -->
  <div class="cards">

    <div class="card">
      <h3><i class="fa-solid fa-eye"></i> 60.5K</h3> 
      <p>Book Views</p>
    </div>

    <div class="card">
      <h3><i class="fa-solid fa-heart"></i> 150</h3> 
      <p>Likes</p>
    </div>

    <div class="card">
      <h3><i class="fa-solid fa-comment"></i> 20</h3>
      <p>Comments</p>
    </div>

    <div class="card">
      <h3><i class="fa-solid fa-book"></i> 24</h3>
      <p>Total Books</p>
    </div>

     <div class="card">
      <h3><i class="fa-solid fa-arrow-trend-up trending"></i> 15</h3> 
      <p>Average Daily Users</p>
    </div>

    <div class="card">
      <h3><i class="fa-solid fa-upload"></i> 2</h3> 
      <p>Average Books Added Daily</p>
    </div>

    <div class="card">
      <h3><i class="fa-solid fa-hand"></i> 200K</h3>
      <p>Site Visited</p>
    </div>

    <div class="card">
      <h3><i class="fa-solid fa-download"></i> 700</h3>
      <p>Books Downloaded</p>
    </div>


  </div>

</div>

</body>
</html>
